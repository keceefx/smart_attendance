<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Smart Attendance Management System</title>

    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="assets/css/custom.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-cczontent-center min-vh-100">

    <div class="container py-4" style="max-width: 440px;">
        
       
        <div class="text-center mb-4">
            <img src="assets/images/companylogo.png" alt="AlphaSoft Logo" class="mb-3" style="max-height: 55px; width: auto;" onerror="this.style.display='none'">
            <h3 class="fw-bold mb-1">AlphaSoft Systems</h3>
            <p class="text-muted small">Smart Attendance Management System</p>
        </div>

        
        <div class="card shadow-sm border-0 rounded-3">
            
           
            <div class="card-header bg-white pt-3 pb-0 border-0">
                <ul class="nav nav-pills nav-justified bg-light p-1 rounded-3" id="roleTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-bold extra-small py-2" id="student-tab" data-role="student" type="button">
                            <i class="fa-solid fa-user-graduate me-1"></i> Student
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold extra-small py-2 text-secondary" id="lecturer-tab" data-role="lecturer" type="button">
                            <i class="fa-solid fa-chalkboard-user me-1"></i> Lecturer
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold extra-small py-2 text-secondary" id="admin-tab" data-role="admin" type="button">
                            <i class="fa-solid fa-user-gear me-1"></i> Admin
                        </button>
                    </li>
                </ul>
            </div>

            <div class="card-body p-4">
                
              
                <div id="loginAlert" class="alert alert-danger d-none py-2 small" role="alert"></div>

                <form id="loginForm">
                 
                    <input type="hidden" id="selectedRole" value="student">

                    
                    <div class="mb-3">
                        <label for="usernameInput" id="identifierLabel" class="form-label text-muted small fw-bold">Matriculation Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted" id="identifierIcon">
                                <i class="fa-solid fa-user-graduate"></i>
                            </span>
                            <input type="text" class="form-control" id="usernameInput" placeholder="e.g. FOC/24/014055" required autocomplete="username">
                        </div>
                    </div>

                   
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label text-muted small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" id="passwordInput" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                    </div>

                    
                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-bold mt-2 shadow-sm">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                    </button>
                </form>

            </div>

            <div class="card-footer bg-light text-center py-3 border-0">
                <span class="text-muted extra-small">Protected System — Authorized Access Only</span>
            </div>
        </div>

    </div>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
