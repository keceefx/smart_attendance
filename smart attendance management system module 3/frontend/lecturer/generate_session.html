<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate sesion S| Smart Attendance Management System</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark px-3 py-2">
        <div class="container">
            <a class="navbar-brand fw-bold" href="lecturer_index.html">
                <i class="fa-solid fa-arrow-left me-2"></i> Back to Lecturer Dashboard
            </a>
            <span class="navbar-text text-white small d-none d-md-inline">
                <i class="fa-solid fa-broadcast-tower me-1"></i> Session Management
            </span>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container py-5" style="max-width: 650px;">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                
                <!-- Header -->
                <div class="text-center mb-4">
                    <span class="badge bg-primary-subtle text-primary p-3 rounded-circle mb-2">
                        <i class="fa-solid fa-headset fs-3"></i>
                    </span>
                    <h4 class="fw-bold mb-1">Start Attendance Session</h4>
                    <p class="text-muted small">Choose your preferred method to verify student attendance in real time.</p>
                </div>

                <!-- Session Options Form -->
                <form id="generateSessionForm">
                    
                    <!-- Select Course -->
                    <div class="mb-3">
                        <label for="courseSelect" class="form-label text-muted extra-small fw-bold text-uppercase">Course</label>
                        <select class="form-select" id="courseSelect" required>
                            <option value="" selected disabled>Choose assigned course...</option>
                            <option value="1">SEN 226 - Software Engineering Principles</option>
                            <option value="2">INS 222 - Information Systems</option>
                            <option value="3">SEN 227 - Database Systems</option>
                        </select>
                    </div>

                    <!-- Attendance Verification Choice -->
                    <div class="mb-4">
                        <label class="form-label text-muted extra-small fw-bold text-uppercase d-block mb-2">Verification Method</label>
                        
                        <div class="row g-3">
                            <!-- Option 1: Bluetooth Beacon -->
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="sessionType" id="methodBluetooth" value="bluetooth" checked autocomplete="off">
                                <label class="btn btn-outline-primary w-100 p-3 text-start rounded-3 h-100" for="methodBluetooth">
                                    <i class="fa-solid fa-bluetooth fs-4 mb-2 d-block text-primary"></i>
                                    <strong class="d-block small">Bluetooth Beacon</strong>
                                    <span class="extra-small text-muted d-block mt-1">Requires physical presence in classroom</span>
                                </label>
                            </div>

                            <!-- Option 2: 30-Min Temporary Passcode -->
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="sessionType" id="methodPasscode" value="passcode" autocomplete="off">
                                <label class="btn btn-outline-warning w-100 p-3 text-start rounded-3 h-100 text-dark" for="methodPasscode">
                                    <i class="fa-solid fa-key fs-4 mb-2 d-block text-warning"></i>
                                    <strong class="d-block small">Backup Passcode</strong>
                                    <span class="extra-small text-muted d-block mt-1">Generates temporary 30-min valid code</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="fa-solid fa-play me-1"></i> Start Attendance
                    </button>
                </form>

                <!-- Dynamic Active Session Display Container -->
                <div id="activeSessionBox" class="mt-4 p-4 border rounded-3 bg-light text-center d-none">
                    <span class="badge bg-success text-white mb-2"><i class="fa-solid fa-signal me-1"></i> Session Active</span>
                    
                    <div id="passcodeDisplayArea" class="d-none my-3">
                        <span class="text-muted extra-small fw-bold text-uppercase d-block mb-1">Temporary Attendance Code</span>
                        <div class="display-4 fw-bold text-primary tracking-widest bg-white py-2 px-3 rounded border" id="generatedCodeText">849201</div>
                        <p class="text-danger extra-small fw-bold mt-2 mb-0">
                            <i class="fa-solid fa-stopwatch me-1"></i> Expires in: <span id="timerCountdown">30:00</span>
                        </p>
                    </div>

                    <div id="bluetoothDisplayArea" class="my-3">
                        <p class="small text-muted mb-1">Broadcasting Bluetooth Beacon ID:</p>
                        <strong class="text-dark bg-white py-1 px-3 border rounded d-inline-block">BEACON-ROOM-402</strong>
                    </div>

                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <a href="live_attendance.html" class="btn btn-sm btn-outline-primary fw-bold">
                            <i class="fa-solid fa-eye me-1"></i> View Live Student Check-ins
                        </a>
                        <button type="button" class="btn btn-sm btn-danger fw-bold" id="stopSessionBtn">
                            <i class="fa-solid fa-stop me-1"></i> End Session
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Local Offline Scripts -->
    <script src="../assets/vendor/js/bootstrap.bundle.min.js"></script>
    <script>
        // Form & Timer Logic Example
        document.getElementById('generateSessionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const selectedMethod = document.querySelector('input[name="sessionType"]:checked').value;
            const sessionBox = document.getElementById('activeSessionBox');
            const passcodeArea = document.getElementById('passcodeDisplayArea');
            const bluetoothArea = document.getElementById('bluetoothDisplayArea');

            sessionBox.classList.remove('d-none');

            if (selectedMethod === 'passcode') {
                // Generate random 6-digit code
                const randomCode = Math.floor(100000 + Math.random() * 900000);
                document.getElementById('generatedCodeText').textContent = randomCode;
                
                passcodeArea.classList.remove('d-none');
                bluetoothArea.classList.add('d-none');
                
                // Start 30-minute timer countdown
                startTimer(30 * 60);
            } else {
                passcodeArea.classList.add('d-none');
                bluetoothArea.classList.remove('d-none');
            }
        });

        // Countdown Timer Functionality
        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('timerCountdown');
            const countdownInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(countdownInterval);
                    display.textContent = "EXPIRED";
                }
            }, 1000);
        }
    </script>
</body>
</html>
