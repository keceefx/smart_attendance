<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Correction Request | Smart Attendance System</title>
   
    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        .extra-small {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark px-3 py-2">
        <div class="container">
            <a class="navbar-brand fw-bold" href="student_index.html">
                <i class="fa-solid fa-arrow-left me-2"></i> Back to Dashboard
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5" style="max-width: 600px;">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                
                <!-- Form Header -->
                <div class="text-center mb-4">
                    <span class="badge bg-warning-subtle text-warning-emphasis p-3 rounded-circle mb-2">
                        <i class="fa-solid fa-triangle-exclamation fs-3"></i>
                    </span>
                    <h4 class="fw-bold mb-1">Request Attendance Correction</h4>
                    <p class="text-muted small">Submit an appeal for missed or incorrectly marked attendance sessions.</p>
                </div>

                <!-- Alert Message Container -->
                <div id="correctionAlert" class="alert alert-info d-none small"></div>

                <!-- Correction Form -->
                <form id="correctionForm" enctype="multipart/form-data">
                    
                    <!-- Matric / Student ID Input -->
                    <div class="mb-3">
                        <label for="studentIdInput" class="form-label text-muted extra-small fw-bold text-uppercase">Matric / Student ID</label>
                        <input type="text" class="form-control" id="studentIdInput" placeholder="e.g. FOC/24/014055" required>
                    </div>

                    <!-- Faculty Dropdown -->
                    <div class="mb-3">
                        <label for="facultySelect" class="form-label text-muted extra-small fw-bold text-uppercase">Faculty</label>
                        <select class="form-select" id="facultySelect" required>
                            <option value="" selected disabled>Select Faculty...</option>
                        </select>
                    </div>

                    <!-- Department Dropdown -->
                    <div class="mb-3">
                        <label for="departmentSelect" class="form-label text-muted extra-small fw-bold text-uppercase">Department</label>
                        <select class="form-select" id="departmentSelect" required>
                            <option value="" selected disabled>Select Faculty first...</option>
                        </select>
                    </div>

                    <!-- Course Code / Title Input -->
                    <div class="mb-3">
                        <label for="courseSelect" class="form-label text-muted extra-small fw-bold text-uppercase">Course Code & Title</label>
                        <input type="text" class="form-control" id="courseSelect" placeholder="e.g. SEN 226 - Software Engineering" required>
                    </div>
                   
                    <!-- Date & Reason Row -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="lectureDate" class="form-label text-muted extra-small fw-bold text-uppercase">Lecture Date</label>
                            <input type="date" class="form-control" id="lectureDate" required>
                        </div>
                        <div class="col-md-6">
                            <label for="reasonType" class="form-label text-muted extra-small fw-bold text-uppercase">Reason Category</label>
                            <select class="form-select" id="reasonType" required>
                                <option value="" selected disabled>Select reason...</option>
                                <option value="technical">App / System Technical Issue</option>
                                <option value="medical">Medical / Health Absence</option>
                                <option value="official">Official School Activity</option>
                                <option value="other">Other Reason</option>
                            </select>
                        </div>
                    </div>

                    <!-- Explanation -->
                    <div class="mb-3">
                        <label for="explanationText" class="form-label text-muted extra-small fw-bold text-uppercase">Detailed Explanation</label>
                        <textarea class="form-control" id="explanationText" rows="3" placeholder="Explain why your attendance should be marked present..." required></textarea>
                    </div>

                    <!-- File Upload -->
                    <div class="mb-4">
                        <label for="evidenceFile" class="form-label text-muted extra-small fw-bold text-uppercase">Supporting Document (Optional)</label>
                        <input class="form-control form-control-sm" type="file" id="evidenceFile" accept=".pdf,.jpg,.jpeg,.png">
                        <div class="form-text extra-small">Upload medical notes, technical screenshots, or official permission forms.</div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark shadow-sm">
                        <i class="fa-solid fa-paper-plane me-1"></i> Submit Correction Appeal
                    </button>
                </form>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="student_app.js"></script>
</body>
</html>
